services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: minitrigger
      POSTGRES_PASSWORD: minitrigger
      POSTGRES_DB: minitrigger
    # The integration project runs its files in parallel, each with its own engines and pools;
    # the default 100 connections is hit at peak ("too many clients already").
    command: ["postgres", "-c", "max_connections=300"]
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minitrigger"]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    # BullMQ requires noeviction.
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "no"]
    ports:
      - "63799:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
